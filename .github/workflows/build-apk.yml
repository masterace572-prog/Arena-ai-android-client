name: Build APK

on:
  push:
    branches: [ main, arena/ac3eff46-arena-ai-android-client ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] && [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-35" > /dev/null
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "::group::Error details"
            grep -E "^e: |error:|warning: unable" build.log | head -80
            echo "::endgroup::"
            grep -E "^e: " build.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "error:" build.log | grep -v "^e: " | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            awk '/What went wrong/{f=1} f&&c<12{print;c++}' build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arena-Android-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
